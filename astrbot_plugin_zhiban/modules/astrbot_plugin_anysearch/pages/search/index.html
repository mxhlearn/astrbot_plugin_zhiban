<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>联网搜索</title>
<style>
:root{color-scheme:light dark;--bg:var(--bg-app,#f5f8f4);--card:var(--bg-card,#fff);--text:var(--text-primary,#24382c);--muted:var(--text-secondary,#617367);--line:var(--border-light,#dce6da);--accent:var(--accent,#2f6b4f);--soft:var(--bg-tint,#eef5ec)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 "Segoe UI",system-ui,sans-serif}.page{max-width:1080px;margin:0 auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.hero h1{margin:0;font-size:24px}.hero p{margin:6px 0 0;color:var(--muted)}.badge{border:1px solid var(--line);background:var(--soft);padding:6px 10px;border-radius:999px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.card h2{font-size:15px;margin:0 0 10px}.value{font-size:22px;font-weight:650}.muted{color:var(--muted)}code{background:var(--soft);border-radius:6px;padding:2px 5px}.commands{display:grid;gap:8px}.command{background:var(--soft);border-radius:9px;padding:10px 12px;overflow-wrap:anywhere}.notice{margin-top:14px;border-left:3px solid var(--accent);padding:10px 12px;background:var(--soft);border-radius:8px}@media(max-width:720px){.page{padding:16px}.grid{grid-template-columns:1fr}.hero{display:block}.badge{display:inline-block;margin-top:10px}}
</style>
</head>
<body>
<main class="page">
  <div class="hero"><div><h1>联网搜索</h1><p>Anysearch 实时网页检索与公开网页正文提取。页面不会预热或自动发起搜索。</p></div><span id="state" class="badge">正在读取状态…</span></div>
  <section class="grid">
    <article class="card"><h2>API 状态</h2><div id="configured" class="value">—</div><div id="detail" class="muted">正在连接模块桥接</div></article>
    <article class="card"><h2>运行边界</h2><div id="limits" class="muted">—</div></article>
  </section>
  <section class="card" style="margin-top:14px"><h2>命令</h2><div class="commands"><div class="command"><code>/anysearch 关键词</code></div><div class="command"><code>/anysearch extract https://example.com/page</code></div><div class="command"><code>/anysearch batch 关键词1,关键词2</code></div><div class="command"><code>/anysearch status</code></div></div><div class="notice">LLM 自动调用默认关闭。API Key、并发、缓存、超时和响应上限在“配置”中统一管理；缺 Key 时只显示未配置，不会联网。</div></section>
</main>
<script>
(async()=>{
  const state=document.getElementById('state'), configured=document.getElementById('configured'), detail=document.getElementById('detail'), limits=document.getElementById('limits');
  try{
    const bridge=window.AstrBotPluginView||window.AstrBotPluginPage;
    if(!bridge) throw new Error('桥接未就绪');
    await bridge.ready();
    const response=await bridge.apiGet('status',{});
    const data=response?.data||response||{};
    const ready=data.configured===true;
    state.textContent=ready?'已配置':'未配置';
    configured.textContent=ready?'API Key 已配置':'API Key 未配置';
    detail.textContent=data.readiness?.detail||'未取得模块状态';
    limits.textContent='并发 '+(data.max_concurrency??'—')+'；响应上限 '+(data.max_response_bytes??'—')+' 字节；查询上限 '+(data.max_query_chars??'—')+' 字符；LLM 工具 '+(data.llm_tools_enabled?'已启用':'默认关闭')+'。';
  }catch(error){
    state.textContent='状态不可用';
    configured.textContent='未连接';
    detail.textContent=String(error?.message||error);
    limits.textContent='不会因页面加载自动发起搜索。';
  }
})();
</script>
</body>
</html>
